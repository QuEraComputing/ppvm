[package]
name = "ppvm-conformance-2"
version = "0.1.0"
edition = "2024"
publish = false

# Test-only harness for the ppvm-*-2 refactor. Depends on both the old and new
# crates so differential tests can replay identical, seeded workloads on each and
# compare. Not shipped. See docs/design/traits-2-implementation-plan.md.
[dependencies]
rand = "0.10.1"
ppvm-pauli-word = { version = "0.1.0", path = "../ppvm-pauli-word" }
ppvm-pauli-word-2 = { version = "0.1.0", path = "../ppvm-pauli-word-2" }
ppvm-lossy-pauli-word-2 = { version = "0.1.0", path = "../ppvm-lossy-pauli-word-2" }
ppvm-phased-pauli-word-2 = { version = "0.1.0", path = "../ppvm-phased-pauli-word-2" }
ppvm-traits = { version = "0.1.0", path = "../ppvm-traits" }
ppvm-traits-2 = { version = "0.1.0", path = "../ppvm-traits-2" }
# The old and new Pauli-sum engines, diffed against each other by the Phase-3
# `Sum` differential suite. The old crate is pulled with default features off so
# the test harness does not drag in dashmap/gxhash/indexmap/approx — the
# differential tests only need its `fxhash` config.
ppvm-pauli-sum = { version = "0.1.0", path = "../ppvm-pauli-sum", default-features = false }
ppvm-pauli-sum-2 = { version = "0.1.0", path = "../ppvm-pauli-sum-2" }

[dev-dependencies]
criterion = "0.7.0"
num = "0.4.3"

[[bench]]
name = "harness_smoke"
harness = false

[[bench]]
name = "pauli_word_bench"
harness = false

[[bench]]
name = "lossy_pauli_word_bench"
harness = false

[[bench]]
name = "phased_pauli_word_bench"
harness = false

[[bench]]
name = "pauli_sum_bench"
harness = false

[[bench]]
name = "pauli_sum_integration"
harness = false
