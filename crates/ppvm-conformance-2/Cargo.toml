[package]
name = "ppvm-conformance-2"
version = "0.1.0"
edition = "2024"
publish = false

# Test-only harness for the ppvm-*-2 refactor. Depends on both the old and new
# crates so differential tests can replay identical, seeded workloads on each and
# compare. Not shipped. See docs/design/traits-2-implementation-plan.md.
[dependencies]
rand = "0.10.1"
ppvm-pauli-word = { version = "0.1.0", path = "../ppvm-pauli-word" }
ppvm-pauli-word-2 = { version = "0.1.0", path = "../ppvm-pauli-word-2" }
ppvm-traits = { version = "0.1.0", path = "../ppvm-traits" }
ppvm-traits-2 = { version = "0.1.0", path = "../ppvm-traits-2" }

[dev-dependencies]
criterion = "0.7.0"
num = "0.4.3"

[[bench]]
name = "harness_smoke"
harness = false

[[bench]]
name = "pauli_word_bench"
harness = false
