[package]
name = "ppvm-pauli-sum"
version = "0.1.0"
edition = "2024"

[dependencies]
ppvm-traits = { version = "0.1.0", path = "../ppvm-traits" }
ppvm-pauli-word = { version = "0.1.0", path = "../ppvm-pauli-word" }
bytemuck = { version = "1", features = ["min_const_generics"] }
fxhash = "0.2.1"
num = "0.4.3"
itertools = "0.14.0"
bon = "3.7.2"
approx = { version = "0.5.1", optional = true }
indexmap = { version = "2.11.4", optional = true }

# Native-only optional dep: dashmap pulls rayon (OS threads), which doesn't build
# on wasm32. Pruned there; the feature goes inert (see the config module gates).
[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
dashmap = { version = "6.1.0", features = ["rayon"], optional = true }

# gxhash only compiles with hardware AES enabled; pruned otherwise, which drops
# the gxhash configs (same condition on the config gates).
[target.'cfg(all(target_feature = "aes", any(target_arch = "x86_64", target_arch = "aarch64")))'.dependencies]
gxhash = { version = "3.5.0", features = ["deterministic"], optional = true }

[dev-dependencies]
criterion = "0.7.0"
insta = { version = "1.43.2", features = ["yaml"] }
rayon = "1.11.0"

[features]
default = ["dashmap", "gxhash", "indexmap", "approx"]
approx = ["dep:approx"]
dashmap = ["dep:dashmap", "ppvm-traits/dashmap"]
gxhash = ["dep:gxhash", "ppvm-traits/gxhash", "ppvm-pauli-word/gxhash"]
indexmap = ["dep:indexmap", "ppvm-traits/indexmap"]

[[bench]]
name = "gate"
harness = false

[[bench]]
name = "random-circuit"
harness = false

[[bench]]
name = "trotter"
harness = false

[[bench]]
name = "trotter-scaling"
harness = false

[[bench]]
name = "micro"
harness = false

[[bench]]
name = "truncation-weight"
harness = false
