[package]
name = "ppvm-pauli-word"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
description = "Packed Pauli-string types (plain, phased, lossy and pattern) for the ppvm simulators."

[dependencies]
ppvm-traits = { version = "0.1.0", path = "../ppvm-traits" }
bitvec = "1.0.1"
bytemuck = { version = "1", features = ["min_const_generics"] }
fxhash = "0.2.1"
num = "0.4.3"
anyhow = "1.0.100"
itertools = "0.14.0"
serde = { version = "1.0.228", features = ["derive"], optional = true }
bincode = { version = "2.0.1", optional = true }

# gxhash only compiles with hardware AES enabled; pruned otherwise (the `gxhash`
# feature goes inert). No non-test code in this crate names the crate.
[target.'cfg(all(target_feature = "aes", any(target_arch = "x86_64", target_arch = "aarch64")))'.dependencies]
gxhash = { version = "3.5.0", features = ["deterministic"], optional = true }

[features]
default = ["gxhash"]
gxhash = ["dep:gxhash"]
serde = ["dep:serde"]
bincode = ["dep:bincode"]
