[package]
name = "ppvm-stim"
version = "0.1.0"
edition = "2024"

[features]
default = ["legacy"]
legacy = ["dep:ppvm-pauli-sum-legacy", "dep:ppvm-tableau-legacy"]
traits-2 = ["dep:ppvm-tableau-2"]
# Parallelise multi-shot sampling across the global rayon thread pool.
rayon = ["dep:rayon"]

[dependencies]
ppvm-pauli-sum-legacy = { package = "ppvm-pauli-sum", version = "0.1.0", path = "../ppvm-pauli-sum", optional = true }
ppvm-tableau-legacy = { package = "ppvm-tableau", version = "0.1.0", path = "../ppvm-tableau", optional = true }
ppvm-tableau-2 = { version = "0.1.0", path = "../ppvm-tableau-2", optional = true }
bitvec = "1.0.1"
itertools = "0.14"
num = "0.4.3"
rand = "0.10.1"
smallvec = "1.15"
thiserror = "2"
stim-parser = { version = "0.1.0", path = "../stim-parser" }

# rayon needs OS threads — native only.
[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
rayon = { version = "1", optional = true }

[dev-dependencies]
# Used by benchmarks.
criterion = "0.7.0"
bnum = { version = "0.13", features = ["numtraits"] }

[[bench]]
name = "tableau-msd-stim"
harness = false

[[bench]]
name = "stim-circuits"
harness = false
