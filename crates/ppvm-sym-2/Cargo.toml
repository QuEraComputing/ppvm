[package]
name = "ppvm-sym-2"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
publish = false
description = "Symbolic (sin/cos polynomial) coefficient ring over ppvm-traits-2."

[dependencies]
# Seed-free hasher for the monomial table, so `Display` output is stable
# across runs.
fxhash = "0.2.1"
num = "0.4"
ppvm-traits-2 = { path = "../ppvm-traits-2" }
