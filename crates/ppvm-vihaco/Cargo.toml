[package]
name = "ppvm-vihaco"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
description = "Run vihaco circuit programs on the ppvm simulators."

[features]
# Parallelism via rayon: shot-level (`run_shots`) and tableau-internal. Off by
# default; enable with `features = ["rayon"]` (native only — wasm has no thread
# support, so keeping it off by default keeps the default build wasm-safe).
rayon = ["dep:rayon", "ppvm-tableau/rayon"]

[dependencies]
bitvec = "1.0.1"
bnum = { version = "0.13.0", features = ["num-traits"] }
chumsky = "0.10.0"
eyre = "0.6.12"
log = "0.4.29"
num = "0.4.3"
rayon = { version = "1.10", optional = true }
ppvm-tableau = { version = "0.1.1", path = "../ppvm-tableau" }
smallvec = "1.15.1"
vihaco = { version = "0.7.0", features = ["program-image-execution"] }
vihaco-stdlib = { version = "0.7.0", features = ["program-image-execution"] }
vihaco-parser = "0.7.0"
vihaco-circuit-isa = { version = "0.1.1", path = "../vihaco-circuit-isa" }
ppvm-pauli-sum = { version = "0.1.1", path = "../ppvm-pauli-sum" }
rand = "0.10.3"
vihaco-cpu = { version = "0.7.0", features = ["program-image-execution"] }
