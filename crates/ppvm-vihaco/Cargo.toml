[package]
name = "ppvm-vihaco"
version = "0.1.0"
edition = "2024"

[features]
default = ["legacy"]
legacy = ["dep:ppvm-pauli-sum-legacy", "dep:ppvm-tableau-legacy"]
traits-2 = ["dep:ppvm-pauli-sum-2", "dep:ppvm-tableau-2"]
# Parallelism is orthogonal to backend selection. It always enables shot-level
# parallelism; the legacy backend additionally retains its existing
# tableau-internal branch. The traits-2 backend makes no such claim.
rayon = ["dep:rayon", "ppvm-tableau-legacy?/rayon"]

[dependencies]
bnum = { version = "0.13.0", features = ["numtraits"] }
chumsky = "0.10.0"
eyre = "0.6.12"
log = "0.4.29"
num = "0.4.3"
rayon = { version = "1.10", optional = true }
ppvm-tableau-legacy = { package = "ppvm-tableau", version = "0.1.0", path = "../ppvm-tableau", optional = true }
ppvm-tableau-2 = { version = "0.1.0", path = "../ppvm-tableau-2", optional = true }
smallvec = "1.15.1"
vihaco = "0.1.1"
vihaco-cpu = "0.1.1"
vihaco-parser = "0.1.1"
vihaco-parser-core = "0.1.1"
vihaco-circuit-isa = { version = "0.1.0", path = "../vihaco-circuit-isa" }
ppvm-pauli-sum-legacy = { package = "ppvm-pauli-sum", version = "0.1.0", path = "../ppvm-pauli-sum", optional = true }
ppvm-pauli-sum-2 = { version = "0.1.0", path = "../ppvm-pauli-sum-2", optional = true }

[dev-dependencies]
# Cross-backend fixture oracles remain on the read-only reference engine.
ppvm-pauli-sum-legacy = { package = "ppvm-pauli-sum", version = "0.1.0", path = "../ppvm-pauli-sum" }
