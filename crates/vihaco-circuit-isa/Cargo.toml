[package]
name = "vihaco-circuit-isa"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
description = "Quantum-circuit instruction set for the vihaco virtual machine, used by ppvm."

[dependencies]
chumsky = "0.10"
eyre = "0.6.12"
smallvec = "1.15.1"
vihaco = "0.4.1"
vihaco-parser = "0.4.1"

[package.metadata.cargo-machete]
ignored = ["eyre", "vihaco-parser"]  # transitive dependency in vihaco, somehow not handled correctly by machete
